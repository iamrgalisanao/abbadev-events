# ABBADev Events API — nginx server block for api.abbadev.com
# Laravel app served from public/ via PHP-FPM. Certbot upgrades :80 to :443.
#
# Install: copy to /etc/nginx/sites-available/api.abbadev.com, then
#   sudo ln -s /etc/nginx/sites-available/api.abbadev.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.abbadev.com

server {
    listen 80;
    listen [::]:80;
    server_name api.abbadev.com;

    root /var/www/abbadev-events/public;
    index index.php;

    charset utf-8;

    # Receipt uploads (RECEIPT_MAX_KB=5120 → allow a little headroom).
    client_max_body_size 8M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Match your installed PHP-FPM socket (e.g. php8.4-fpm).
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Never serve dotfiles (.env, .git, etc.).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
