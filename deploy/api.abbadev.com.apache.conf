# ABBADev Events API — Apache vhost for api.abbadev.com
# Laravel app served from public/ via php-fpm. Certbot adds the :443 vhost.
#
# Install: copy to /etc/apache2/sites-available/api.abbadev.com.conf, then
#   sudo a2enmod proxy proxy_fcgi rewrite
#   sudo a2ensite api.abbadev.com
#   sudo apachectl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d api.abbadev.com

<VirtualHost *:80>
    ServerName api.abbadev.com

    DocumentRoot /var/www/abbadev-events/public

    <Directory /var/www/abbadev-events/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Hand PHP to php8.4-fpm explicitly (pins the version for this app on a box
    # where multiple PHP versions are installed). Adjust the socket if needed.
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Receipt uploads (~5 MB + headroom).
    LimitRequestBody 8388608

    ErrorLog ${APACHE_LOG_DIR}/api-abbadev-error.log
    CustomLog ${APACHE_LOG_DIR}/api-abbadev-access.log combined
</VirtualHost>
